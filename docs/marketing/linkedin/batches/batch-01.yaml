    body: |
      "Off market properties for sale" gets searched thousands of times a month.

      It is a contradiction. There is no marketplace for off-market properties. That is what off-market means.

      What the searcher actually wants is two things:

      1. The places those properties come from
      2. A way to know what one is worth when there is no list price to react to

      Most content answers the first and skips the second. That is backwards, because the single biggest mistake in off-market investing is letting the owner's number become your number.

      Do the math before the call. Income Value. Target Buy. Then ask them what they need, and measure the gap.

      Seven channels ranked by effort, and the pricing method, in the comments.

      #RealEstateInvesting #InvestmentProperty

