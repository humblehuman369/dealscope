      Swipe through. The order matters more than the list.

      Beginners with time and little capital: driving for dollars, agents, listing keywords. The cost is hours.

      Investors with capital and no time: wholesaler flow and skip-traced records. The cost is dollars and other people's numbers.

      Everyone: the agent channel. It is nearly free and agents hear about sales before they happen.

      The rule underneath all seven: consistency beats intensity. A hundred letters a month for a year beats a thousand once.

      Save this for the next time you are staring at a listing site wondering where the deals are.

