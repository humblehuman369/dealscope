      A lead is a phone number and an address.

      What a cash buyer will pay for it, what you can contract it at, and whether assigning it is even the right move: most wholesalers estimate those in their head on the way to the call.

      Fifteen seconds puts them on the screen first.

      → the maximum allowable offer an end buyer supports, with repaired value and rehab shown so you can adjust them
      → your spread, in dollars, before you name a price
      → assign, hold or flip on one screen, so you see when a fee today leaves a decade of cash flow on the table

      It works on addresses that are not listed. An off-market lead gets the same verdict as a Zillow listing.

      Nine reasons in the carousel. Free, no signup, no card.

