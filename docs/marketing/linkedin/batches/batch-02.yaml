    first_comment: "https://dealgapiq.com/for/house-hackers?utm_source=linkedin&utm_medium=founder&utm_campaign=house-hackers&utm_content=carousel"
    body: |
      Most house hackers get the FHA pre-approval first and check the numbers second.

      That order is backwards.

      A pre-approval tells you what a lender will let you borrow. It says nothing about what the duplex will cost you to live in once the other unit's rent comes in.

      Those are different numbers. The second one is the one you live with.

      Before the lender asks for documents, run the address:
      → owner-occupied financing modeled, not approximated
      → what the rented units actually cover
      → what the property turns into when you move out

      Eight reasons in the carousel. The verdict itself is free, no signup, no card.

      Full list in the comments.

