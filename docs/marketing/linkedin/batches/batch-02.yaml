      Buying where you do not live means every mistake costs a plane ticket.

      Most remote investors fly to see properties a 15-second verdict would have removed from the list.

      Run the whole shortlist from the couch first:
      → property tax, vacancy and appreciation for the state you are buying in, published and applied automatically
      → three value sources side by side. When one has no data for the address it reads unavailable; nothing is made up
      → the Deal Gap in dollars: asking price minus the price that works

      Then book the flight for the two that survived.

