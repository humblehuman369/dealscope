name: Scheduled backend jobs

# Fires the backend's cron-gated job endpoints (backend/app/routers/jobs.py).
# The backend authenticates these calls via the X-Cron-Token header, which
# must match the CRON_SECRET env var on the Railway backend service.
#
# One-time setup (both must hold the SAME value):
#   1. Railway  → backend service → Variables → CRON_SECRET=<random 32+ chars>
#   2. GitHub   → repo Settings → Secrets and variables → Actions →
#      New repository secret → CRON_SECRET=<same value>
#
# Optional: repo variable BACKEND_URL overrides the default Railway URL.
#
# LinkedIn publisher secrets live on Railway (not GitHub):
#   LINKEDIN_PUBLISH_ENABLED, LINKEDIN_API_VERSION,
#   LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET,
#   LINKEDIN_FOUNDER_ACCESS_TOKEN, LINKEDIN_FOUNDER_REFRESH_TOKEN,
#   LINKEDIN_FOUNDER_PERSON_URN, LINKEDIN_TOKEN_EXPIRES_AT_FOUNDER,
#   LINKEDIN_COMPANY_ACCESS_TOKEN, LINKEDIN_COMPANY_REFRESH_TOKEN,
#   LINKEDIN_COMPANY_ORG_URN, LINKEDIN_TOKEN_EXPIRES_AT_COMPANY
# GitHub only needs CRON_SECRET (already required for the daily jobs).
#
# Marketing metrics pull secrets also live on Railway:
#   POSTHOG_PERSONAL_API_KEY, POSTHOG_PROJECT_ID, POSTHOG_API_HOST,
#   GSC_SERVICE_ACCOUNT_JSON, GSC_SITE_URL
# Unset sources are skipped (reported as "skipped"), never fabricated.

on:
  schedule:
    # 11:00 UTC ≈ 6-7am ET — price data has refreshed overnight; the push
    # lands at the start of the investor's day.
    - cron: '0 11 * * *'
    # LinkedIn + X queues: every 30 minutes. Gated per-job so the daily jobs
    # do not inherit this cadence.
    - cron: '*/30 * * * *'
    # Marketing metrics: 06:00 UTC, before the Grok Bot routines (06:30 ET)
    # read /context, so yesterday's PostHog funnel is already in Postgres.
    - cron: '0 6 * * *'
    # Marketing alerts: 12:00 UTC, an hour after the last bot routine should
    # have closed its run. Emails admins only when something is wrong.
    - cron: '0 12 * * *'
    # Weekly rollup brief: Mondays 12:15 UTC, after Monday's metrics pull.
    - cron: '15 12 * * 1'
  # Manual trigger for testing and catch-up runs.
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-cron-jobs
  cancel-in-progress: false

jobs:
  gap-alerts:
    name: Gap Alerts (price-drop pushes)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/gap-alerts
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/gap-alerts" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1

  # Runs in the same off-peak slot on purpose. The alert job dispatches
  # ordinary map searches, so its results land in the shared viewport cache
  # ahead of the day's interactive traffic — the farm areas investors watch
  # are pre-warmed rather than double-billed.
  saved-search-alerts:
    name: Saved search new-inventory emails
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/saved-search-alerts
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/saved-search-alerts" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1

  overdue-task-digest:
    name: Overdue task digest pushes
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/overdue-task-notifications
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/overdue-task-notifications" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1

  marketing-metrics:
    name: Marketing metrics (PostHog + Search Console)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/marketing-metrics
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/marketing-metrics" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1
          python3 -c "
          import json, sys
          data = json.load(open('response.json'))
          errors = {k: v for k, v in data.items() if isinstance(v, dict) and v.get('status') == 'error'}
          if errors:
              print('source errors:', errors)
              sys.exit(1)
          "

  marketing-alerts:
    name: Marketing alerts (missed bot runs, token expiry, overdue crons)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/marketing-alerts
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/marketing-alerts" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1

  marketing-weekly-rollup:
    name: Marketing weekly rollup brief
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/jobs/marketing-weekly-rollup
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/marketing-weekly-rollup" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1

  linkedin-publish:
    name: LinkedIn publisher
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: linkedin-publish
      cancel-in-progress: false
    steps:
      - name: POST /api/v1/jobs/linkedin-publish
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/linkedin-publish" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1
          python3 -c "
          import json, sys
          data = json.load(open('response.json'))
          failed = data.get('failed') or []
          if failed:
              print('failed rows:', failed)
              sys.exit(1)
          "

  x-publish:
    name: X publisher
    # Shares the 30-minute schedule with LinkedIn; its own concurrency group
    # so a slow LinkedIn tick never blocks X and vice versa.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: x-publish
      cancel-in-progress: false
    steps:
      - name: POST /api/v1/jobs/x-publish
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dealscope-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — see workflow header for setup."
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/v1/jobs/x-publish" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $http_code"
          cat response.json
          [ "$http_code" = "200" ] || exit 1
          python3 -c "
          import json, sys
          data = json.load(open('response.json'))
          failed = data.get('failed') or []
          if failed:
              print('failed rows:', failed)
              sys.exit(1)
          "
