[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations as a one-off pre-deploy task. If this fails, Railway
# rejects the deploy and the previous version stays live — which is what
# we want, because shipping new code against a stale schema is what
# caused the saved-properties / pipeline incident. fix_alembic.py also
# guards against this at boot, but preDeployCommand is the proper Railway
# pattern: it runs once per deploy in a dedicated task, not on every
# replica boot.
#
# Reference-data seeds follow the migration in the same task. They are
# idempotent upserts sourced from files committed to the image, so a repeat
# run is a sub-second no-op, and a failure blocking the deploy is correct
# for the same reason a failed migration is: the new code expects the data.
#
# Order matters. backfill_service_area reads all four seeded tables — it
# resolves buyer coverage text against geo_counties and geo_cities, and writes
# rows keyed to lenders.id and cash_buyers.id — so it must run last.
preDeployCommand = "alembic upgrade head && python -m scripts.seed_geo_counties && python -m scripts.seed_geo_cities && python -m scripts.seed_lenders && python -m scripts.seed_cash_buyers && python -m scripts.backfill_service_area"

# fix_alembic.py runs `alembic upgrade head` again as a defense-in-depth
# safety net (no-op if preDeployCommand already ran), and also handles the
# historical auth-column recovery path for very old databases.
startCommand = "python fix_alembic.py"

healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
