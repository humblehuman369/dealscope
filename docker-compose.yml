version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dealgapiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealgapiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dealgapiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for the backend test suite. Image and credentials match
  # the Postgres service in .github/workflows/ci.yml so local runs and CI agree.
  # Deliberately volume-less: every run starts from a clean schema.
  #
  # Host port 5433 keeps it clear of the app `db` above, so both can run at once.
  # Started only via its profile: `docker compose --profile test up -d test-db`.
  test-db:
    image: postgres:16-alpine
    container_name: dealgapiq-test-db
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealgapiq-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dealgapiq
      - REDIS_URL=redis://redis:6379/0
      - RENTCAST_API_KEY=${RENTCAST_API_KEY}
      - RENTCAST_URL=https://api.rentcast.io/v1
      - AXESSO_API_KEY=${AXESSO_API_KEY}
      - AXESSO_URL=https://api.axesso.de/zil
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: dealgapiq-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
